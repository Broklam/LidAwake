name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run isolated tests before releasing
        shell: pwsh
        run: ./tests/Test.ps1

      - name: Build installer and portable executable
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content -Raw -LiteralPath Program.cs
          $match = [regex]::Match($source, '(?m)^\[assembly: AssemblyVersion\("(?<major>\d+)\.(?<minor>\d+)\.\d+\.\d+"\)\]')
          if (-not $match.Success) { throw 'Could not read the base version from Program.cs.' }
          $buildNumber = [int]$env:GITHUB_RUN_NUMBER
          if ($buildNumber -lt 1 -or $buildNumber -gt 65534) { throw 'Workflow run number is outside the supported version range.' }
          $tag = 'v{0}.{1}.{2}' -f $match.Groups['major'].Value, $match.Groups['minor'].Value, $buildNumber
          $version = $tag.Substring(1) + '.0'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          & ./Package.ps1 -Version $version
          $portable = "dist/LidAwake-$tag-Portable.exe"
          $setup = "dist/LidAwake-$tag-Setup.exe"
          foreach ($asset in @($portable, $setup)) {
              if ([version](Get-Item -LiteralPath $asset).VersionInfo.FileVersion -ne [version]$version) {
                  throw "Unexpected executable version: $asset"
              }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "portable=$portable" >> $env:GITHUB_OUTPUT
          "setup=$setup" >> $env:GITHUB_OUTPUT

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
          RELEASE_PORTABLE: ${{ steps.build.outputs.portable }}
          RELEASE_SETUP: ${{ steps.build.outputs.setup }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ref = "refs/tags/$env:RELEASE_TAG"
          $tagRefsJson = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not check the release tag.' }
          $tagRefs = @($tagRefsJson | ConvertFrom-Json | Where-Object { $_.ref -ceq $ref })
          if ($tagRefs.Count -eq 0) {
              gh api -X POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=$ref" -f "sha=$env:GITHUB_SHA" | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'Could not create the release tag; it may have been created concurrently.' }
          }
          $tagCommit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:RELEASE_TAG" --jq '.sha'
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $env:GITHUB_SHA) {
              throw 'The release tag does not point to this workflow commit; refusing to publish.'
          }
          $assets = @($env:RELEASE_PORTABLE, $env:RELEASE_SETUP)
          $releaseJson = gh release view $env:RELEASE_TAG --json assets 2>$null
          if ($LASTEXITCODE -eq 0) {
              $release = $releaseJson | ConvertFrom-Json
              $missing = @()
              foreach ($asset in $assets) {
                  $existing = @($release.assets | Where-Object { $_.name -ceq [IO.Path]::GetFileName($asset) })
                  if ($existing.Count -gt 1) { throw "Duplicate release assets found for $asset." }
                  if ($existing.Count -eq 0) { $missing += $asset; continue }
                  $digest = 'sha256:' + (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
                  if ($existing[0].digest -cne $digest) {
                      throw "An existing release asset has a different or unavailable digest: $asset"
                  }
              }
              if ($missing.Count -gt 0) {
                  gh release upload $env:RELEASE_TAG @missing
                  if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release assets.' }
              }
          } else {
              gh release create $env:RELEASE_TAG @assets --verify-tag --target $env:GITHUB_SHA --title "Lid Awake $env:RELEASE_TAG" --generate-notes
              if ($LASTEXITCODE -ne 0) { throw 'Failed to publish the release.' }
          }
