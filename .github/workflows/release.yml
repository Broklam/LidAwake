name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build versioned executable
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content -Raw -LiteralPath Program.cs
          $match = [regex]::Match($source, '(?m)^\[assembly: AssemblyVersion\("(?<major>\d+)\.(?<minor>\d+)\.\d+\.\d+"\)\]')
          if (-not $match.Success) { throw 'Could not read the base version from Program.cs.' }
          $buildNumber = [int]$env:GITHUB_RUN_NUMBER
          if ($buildNumber -lt 1 -or $buildNumber -gt 65534) { throw 'Workflow run number is outside the supported version range.' }
          $tag = 'v{0}.{1}.{2}' -f $match.Groups['major'].Value, $match.Groups['minor'].Value, $buildNumber
          $version = $tag.Substring(1) + '.0'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $asset = "dist/LidAwake-$tag.exe"
          & ./Build.ps1 -OutputPath $asset -Version $version
          if ([version](Get-Item -LiteralPath $asset).VersionInfo.FileVersion -ne [version]$version) {
              throw 'The built executable has an unexpected version.'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "asset=$asset" >> $env:GITHUB_OUTPUT

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
          RELEASE_ASSET: ${{ steps.build.outputs.asset }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:RELEASE_TAG --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $env:RELEASE_TAG $env:RELEASE_ASSET --clobber
          } else {
              gh release create $env:RELEASE_TAG $env:RELEASE_ASSET --target $env:GITHUB_SHA --title "Lid Awake $env:RELEASE_TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish the release.' }
